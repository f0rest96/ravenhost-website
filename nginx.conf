server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Charset & compression ────────────────────────────────────────────────
    charset utf-8;

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;

    # Content-Security-Policy
    # Three.js is bundled locally — no CDN scripts needed.
    # 'unsafe-inline' is NOT needed because Tailwind outputs an external stylesheet.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data:; \
         font-src 'self'; \
         connect-src 'self'; \
         worker-src 'none'; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self';"
        always;

    # HSTS — enable once HTTPS is confirmed working
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Static asset caching ─────────────────────────────────────────────────
    # Astro fingerprints all assets in _astro/ — safe to cache aggressively
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.(ico|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA / Astro static routing ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Custom error pages ───────────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # ── Hide nginx version ───────────────────────────────────────────────────
    server_tokens off;
}
