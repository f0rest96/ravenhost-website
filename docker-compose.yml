services:
  ravenhost-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ravenhost-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3002}:80"   # loopback only — cloudflared tunnels this to the web
    environment:
      - TZ=UTC
