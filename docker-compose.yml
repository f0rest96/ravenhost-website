services:
  ravenhost-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ravenhost-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"   # Bind to loopback — put a real reverse proxy in front
    environment:
      - TZ=UTC
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ravenhost.rule=Host(`ravenhost.org`,`www.ravenhost.org`)"
      - "traefik.http.routers.ravenhost.entrypoints=websecure"
      - "traefik.http.routers.ravenhost.tls.certresolver=letsencrypt"

# Optional: uncomment to use Traefik as reverse proxy
# networks:
#   default:
#     external: true
#     name: traefik
