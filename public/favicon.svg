<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1a6fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0041a3" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a6fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#070810"/>
  <circle cx="32" cy="32" r="31" fill="url(#glowGrad)"/>

  <!-- Raven silhouette (simplified, stylized) -->
  <!-- Body -->
  <ellipse cx="32" cy="34" rx="13" ry="11" fill="url(#bgGrad)"/>
  <!-- Head -->
  <ellipse cx="34" cy="22" rx="8" ry="8" fill="url(#bgGrad)"/>
  <!-- Beak -->
  <polygon points="41,21 47,23 41,25" fill="#00a8ff"/>
  <!-- Eye -->
  <circle cx="37" cy="20" r="1.8" fill="#00d4ff"/>
  <circle cx="37" cy="20" r="0.8" fill="#070810"/>
  <!-- Wing left -->
  <path d="M19,30 Q10,24 14,38 Q20,34 22,32 Z" fill="#1a6fff" opacity="0.85"/>
  <!-- Wing right (folded) -->
  <path d="M44,30 Q51,26 48,40 Q42,36 40,33 Z" fill="#1a4ca3" opacity="0.7"/>
  <!-- Tail -->
  <path d="M24,44 Q32,50 40,44 Q36,48 32,49 Q28,48 24,44 Z" fill="#1a6fff" opacity="0.8"/>

  <!-- Server rack accent lines on wings -->
  <line x1="15" y1="31" x2="18" y2="33" stroke="#00d4ff" stroke-width="0.8" opacity="0.7"/>
  <line x1="15" y1="33" x2="17" y2="35" stroke="#00d4ff" stroke-width="0.8" opacity="0.7"/>
  <line x1="46" y1="31" x2="43" y2="33" stroke="#00a8ff" stroke-width="0.8" opacity="0.5"/>
</svg>
